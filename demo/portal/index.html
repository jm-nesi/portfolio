<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Portal Demo</title>
    <meta name="description" content="Interactive demo of an employee self-service portal. All data is fictional.">
    <script>
        try { const t = localStorage.getItem('portal-demo-theme'); if (['light', 'dark', 'navy'].includes(t)) document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="portal.css">
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>

<div class="demo-ribbon" role="note">
    <span><strong>Demo mode</strong> · fictional data · changes reset on reload</span>
    <a href="../../index.html#projects">← Back to portfolio</a>
</div>

<section class="login" id="loginView" hidden>
    <form class="card" id="loginForm">
        <div class="login-brand">
            <span class="rail-logo" aria-hidden="true">A</span>
            <div><h1 style="font-size:1.125rem">Employee Portal</h1><p class="hint">Acme Staffing Co.</p></div>
        </div>
        <div class="form">
            <label class="field">Employee ID<input class="input" id="loginId" value="24022" inputmode="numeric"></label>
            <label class="field">Password<input class="input" type="password" value="demo1234"></label>
            <p class="err" id="loginErr" hidden>That employee ID isn't in the demo. Use one of the accounts below.</p>
            <button class="btn btn-primary" type="submit">Sign in</button>
        </div>
        <div class="demo-accounts">
            <p class="hint">Demo accounts (any password):</p>
            <button type="button" data-acct="24022"><strong>24022 · Jamie Cruz</strong><br><span class="hint">Team leader: sees the Approvals menu</span></button>
            <button type="button" data-acct="24001"><strong>24001 · Alex Rivera</strong><br><span class="hint">Regular employee</span></button>
        </div>
    </form>
</section>

<div id="appView" hidden>
    <div class="mobile-bar">
        <button type="button" id="openRail" aria-label="Open menu"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg></button>
        <strong>Employee Portal</strong>
    </div>
    <nav class="rail" id="rail" aria-label="Main"></nav>
    <main class="shell" id="page"></main>
</div>

<div id="modalRoot"></div>

<script src="../shared/data.js"></script>
<script src="portal.js"></script>
</body>
</html>
